
# ============================================================
# dataset_builder.py — configuration file
# ============================================================

paths:
  qcd_base:     /ceph/abal/QFIT/MC/HDF5/qcd_dijet
  qcd_filename: qcd_dijet.h5
  top_base:     /ceph/abal/QFIT/MC/HDF5/TTBar_SMEFT_cTG_0p05
  top_filename: TTBar_SMEFT_cTG_0p05.h5

# Kinematic selection applied to jetFeatures columns.
# idx_pt and idx_sdmass default to 0 and 5 respectively if omitted.
cuts:
  pt_cut:      300.0   # GeV — minimum jet pT
  mass_win_lo: 150.0   # GeV — soft-drop mass window lower edge
  mass_win_hi: 200.0   # GeV — soft-drop mass window upper edge
  idx_pt:      0       # jetFeatures column index for jet pT
  idx_sdmass:  5       # jetFeatures column index for soft-drop mass

dataset:
  frac_top: 1.0   # TTBar fraction in the output dataset. Use 0.0 for pure QCD, 1.0 for pure TTBar.

compute:
  chunk_size: 2000  # Jets processed per inner loop (memory ↔ speed)